name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Required only for publishing on main; PRs never use registry credentials.
      packages: write
    defaults:
      run:
        shell: bash
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_EMAIL_SERVICE_ID: ${{ vars.NEXT_PUBLIC_EMAIL_SERVICE_ID }}
      NEXT_PUBLIC_EMAIL_TEMPLATE_ID: ${{ vars.NEXT_PUBLIC_EMAIL_TEMPLATE_ID }}
      NEXT_PUBLIC_EMAIL_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_EMAIL_PUBLIC_KEY }}
      # Only used to satisfy Compose's runtime configuration validation.
      STRIPE_SECRET_KEY: ${{ secret.STRIPE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check build configuration
        run: |
          for key in NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_APP_ID \
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY NEXT_PUBLIC_EMAIL_SERVICE_ID \
            NEXT_PUBLIC_EMAIL_TEMPLATE_ID NEXT_PUBLIC_EMAIL_PUBLIC_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing Actions variable: $key"
              exit 1
            fi
          done
      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s > /tmp/fruitku-manifests.yaml
      - name: Build image
        run: docker compose build app
      - name: Test container
        run: |
          docker compose up -d --no-build --wait --wait-timeout 90
          docker compose exec -T app node < scripts/container-smoke.cjs
      - name: Publish tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag fruitku:local "$image:$tag"
          docker push "$image:$tag"
          digest=$(docker image inspect "$image:$tag" --format '{{index .RepoDigests 0}}')
          printf 'Published tested image: `%s`\n\nDeploy by digest: `%s`\n' "$image:$tag" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color app
      - name: Cleanup
        if: always()
        run: |
          docker compose down
          docker logout ghcr.io
